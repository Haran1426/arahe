
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IG GAME STUDIO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #10151c;
            color: white;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(90%, 750px);
        }

        .label {
            color: #a6e775;
            letter-spacing: 5px;
            font-size: 13px;
        }

        h1 {
            font-size: clamp(32px, 7vw, 60px);
            margin: 15px 0;
        }

        p {
            color: #9ca3af;
            line-height: 1.7;
        }

        .card {
            margin-top: 35px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 30px;
            background: #1b2530;
            border: 1px solid #394b48;
            border-radius: 24px;
            text-decoration: none;
            color: white;
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #a6e775;
            box-shadow: 0 15px 40px #a6e77520;
        }

        .thumbnail {
            width: 160px;
            height: 160px;
            background: #293f30;
            border-radius: 20px;
            display: grid;
            place-items: center;
        }

        .thumbnail img {
            width: 125px;
            height: 125px;
            object-fit: contain;
        }

        .info {
            flex: 1;
            min-width: 180px;
        }

        .tag {
            font-size: 11px;
            font-weight: bold;
            color: #152419;
            background: #a6e775;
            padding: 6px 10px;
            border-radius: 5px;
        }

        .play {
            color: #a6e775;
            font-weight: bold;
        }

        footer {
            margin-top: 35px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main>

        <div class="label">IG STUDIO / ARCADE</div>

        <h1>GAME STUDIO</h1>

        <p>미니게임을 선택하고 플레이하세요.</p>

        <a class="card" href="./sika/main.html">

            <div class="thumbnail">
                <img src="./sika/image/10_watermelon.png"
                     alt="수박">
            </div>

            <div class="info">

                <span class="tag">PLAY NOW</span>

                <h2>JUICY LAB</h2>

                <p>
                    과일을 합쳐 수박을 만들어 보세요!<br>
                    콤보와 특수 능력을 활용하는 합체 게임.
                </p>

                <span class="play">게임 시작 →</span>

            </div>

        </a>

        <footer>
            IG STUDIO · Powered by Matter.js
        </footer>

    </main>

</body>
</html>
